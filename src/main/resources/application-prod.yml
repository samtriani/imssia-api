lmstudio:
  url: http://10.105.20.20:8000
  default-model: qwen2.5-vl-72b
  max-tokens: 1024
  temperature: 0.1
  top-p: 0.9
  repetition-penalty: 1.1
  # min-tokens: fuerza al modelo a generar al menos N tokens antes de permitir EOS.
  # Workaround para un bug intermitente del servidor vLLM (Qwen2.5-VL-72B-AWQ) que
  # con prompts largos devuelve EOS tras 1-2 tokens de forma NO determinista
  # (misma petición: a veces responde completo, a veces solo "Para"). Ver README/notas.
  min-tokens: 16
  stop:
    - "<|endoftext|>"
    - "<|im_end|>"

orientador:
  # El Orientador no escribe en imss_ai.pamt_rag_consulta_log en este despliegue.
  rag-log-enabled: false
